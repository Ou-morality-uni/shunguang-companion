name: Package Windows update
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  windows-package:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content update.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "v$version") { throw 'Release tag does not match update.json' }
          $managed = Get-Content scripts/update-managed.txt -Encoding utf8
          $missing = git -c core.quotepath=false ls-files | Where-Object {
            $_ -match '^(backend/app/|backend/requirements[^/]*\.txt$|scripts/|source/|frontend/|skills/|versions/)' -and $_ -notin $managed
          }
          if ($missing) { throw ("补全 scripts/update-managed.txt 后重新构建: " + ($missing -join ', ')) }
          python -c "import json; from backend.app.constants import VERSION; assert VERSION == json.load(open('update.json'))['version'] == json.load(open('frontend/package.json'))['version']"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run verify
      - name: Build and verify package
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          python scripts/desktop_update.py build --output "shunguang-$version-windows.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m zipfile -t "shunguang-$version-windows.zip"
      - name: Attach verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" "shunguang-$($env:RELEASE_TAG.Substring(1))-windows.zip"

