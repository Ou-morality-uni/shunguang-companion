name: Verify
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python scripts/export-openapi.py --check

  retrieval:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-rag.lock.txt
      - name: Create isolated retrieval environment
        run: python -m venv .venv-rag
      - run: >-
          .\.venv-rag\Scripts\python.exe -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu --only-binary=:all:
      - run: >-
          .\.venv-rag\Scripts\python.exe -m pip install -r backend/requirements-rag.lock.txt --only-binary=:all:
      - run: .\.venv-rag\Scripts\python.exe -m pip check
      - name: Verify retrieval libraries and CPU computation
        run: >-
          .\.venv-rag\Scripts\python.exe -c "import torch, transformers, qdrant_client, numpy, sentencepiece;
          assert torch.isfinite(torch.ones((8, 8)) @ torch.ones((8, 8))).all();
          assert torch.from_numpy(numpy.ones((2, 2))).sum().item() == 4;
          from transformers import AutoModel, AutoTokenizer;
          print('CPU retrieval dependencies verified; full BGE-M3 inference is a separate local check.')"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git diff --exit-code -- src/generated/api-schema.d.ts
      - run: npm run verify
