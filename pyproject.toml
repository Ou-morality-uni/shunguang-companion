[project]
name = "shunguang-companion"
version = "0.7.13"
description = "Local-first companion service"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["backend/**/*.py", "scripts/export-openapi.py", "scripts/dev.py", "scripts/qa-ui-server.py", "scripts/export-public.py", "scripts/evaluate-agent.py", "scripts/install-project.py", "scripts/run-console.py", "scripts/project_lock.py", "scripts/disable-local-qq.py", "scripts/package-server.py", "scripts/verify-server-container.py", "deploy/server-lite/manage.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "single"
