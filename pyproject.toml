[project]
name = "shunguang-companion"
version = "0.1.5"
description = "Local-first companion service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["backend/**/*.py", "scripts/export-openapi.py", "scripts/dev.py", "scripts/qa-ui-server.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "single"
